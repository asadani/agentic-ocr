project:
  type: book
  output-dir: _book

book:
  title: "Agentic OCR in 2026"
  subtitle: "An opinionated practitioner's field guide"
  author: "Anuj Sadani"
  date: "2026-05-21"
  date-format: "MMMM YYYY"
  search: true
  repo-url: https://github.com/anujsadani/agentic-ocr
  repo-actions: [edit, issue]
  downloads: [pdf]
  output-file: agentic-ocr-2026
  sharing: [twitter, linkedin]
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - part: "Part I — Foundations"
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-history.qmd
        - chapters/03-what-it-is.qmd
    - part: "Part II — Architecture"
      chapters:
        - chapters/04-architecture.qmd
        - chapters/05-self-correction.qmd
        - chapters/06-shift-left.qmd
    - part: "Part III — The 2026 Landscape"
      chapters:
        - chapters/07-commercial-players.qmd
        - chapters/08-opensource-players.qmd
        - chapters/09-vendor-selection.qmd
    - part: "Part IV — Evaluation & Integration"
      chapters:
        - chapters/10-benchmarks.qmd
        - chapters/11-evaluating-your-pipeline.qmd
        - chapters/12-rag.qmd
    - part: "Part V — Reality Check"
      chapters:
        - chapters/13-anti-patterns.qmd
        - chapters/14-limitations.qmd
        - chapters/15-conclusion.qmd
  appendices:
    - appendices/glossary.qmd
    - appendices/bibliography.qmd
    - appendices/cheatsheet.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    mermaid:
      theme: neutral
  typst:
    papersize: a4
    margin:
      x: 22mm
      y: 25mm
    toc-depth: 3
    number-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-width: 6
    fig-asp: 0.7
    include-in-header:
      text: |
        // Tighten tables: smaller font, no justification (kills hyphenated splits
        // and rivers inside narrow cells), tighter line spacing.
        #show table: it => {
          set text(size: 9.5pt)
          set par(justify: false, leading: 0.55em)
          it
        }

        // Mermaid diagrams: Quarto emits #box(image(..., width: 16in, height: ...))
        // with the SVG's natural inch dimensions, which routinely exceed the
        // ~6.5in A4 text width. Our set rules can't override the explicit
        // width parameter, so we instead intercept the wrapping box and
        // scale it down proportionally when it exceeds the available width.
        #show box: it => layout(size => {
          let m = measure(it)
          if m.width > size.width and size.width > 0pt {
            let s = size.width / m.width
            scale(x: s * 100%, y: s * 100%, origin: top + left, reflow: true, it)
          } else {
            it
          }
        })

execute:
  freeze: auto
  echo: false
