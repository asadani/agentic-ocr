name: Render and Publish

on:
  # Auto-trigger on push to main is disabled until the CI render
  # hang is debugged (Mermaid SVG step stalled even with Chromium
  # pre-installed). For now, run manually via the Actions tab or by
  # rendering locally with `quarto render` and pushing `_book/` to
  # the gh-pages branch.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Chromium (for Mermaid SVG rendering in PDF)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Render book (HTML + PDF via Typst)
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
